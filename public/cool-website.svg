import tkinter as tk
import time

def start_fake_hack():
    text_widget.insert(tk.END, "Connecting to target...\n")
    text_widget.update()
    time.sleep(1)
    text_widget.insert(tk.END, "Access granted...\n")
    text_widget.update()
    time.sleep(1)

    for i in range(0, 101, 10):
        text_widget.insert(tk.END, f"Downloading data... {i}%\n")
        text_widget.update()
        time.sleep(0.3)

    text_widget.insert(tk.END, "\nSYSTEM BREACH DETECTED!\n")
    text_widget.insert(tk.END, "LOCATION: UNKNOWN\n")
    text_widget.update()
    time.sleep(1.5)
   

# Setup window
root = tk.Tk()
root.title("Hacker Console")
root.configure(bg="black")

text_widget = tk.Text(root, bg="black", fg="lime", font=("Courier", 12))
text_widget.pack(fill=tk.BOTH, expand=True)

root.after(1000, start_fake_hack)
root.mainloop()
